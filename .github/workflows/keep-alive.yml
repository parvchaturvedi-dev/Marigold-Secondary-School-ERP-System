name: Keep backend awake

# Pings the Render backend every ~5 minutes to reduce free-tier cold starts.
# Note: GitHub disables scheduled workflows after 60 days with no repo activity,
# and cron timing can drift a few minutes under load, so this cannot guarantee
# the Render service will always stay awake.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://marigold-secondary-school-erp-system.onrender.com/api/health || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Backend did not return 200 after 3 attempts (may still be waking up)."
          exit 0
